schema: vehicle

extends: entity_core

fields:

  vehicle_class:
    type: string
    optional: true

  produced_by:
    type: entity_list
    target: faction
    optional: true

  uses_technology:
    type: entity_list
    target: technology
    optional: true

  operated_by:
    type: entity_list
    target: formation
    optional: true

  operators:
    type: entity_list
    target:
      - factions
      - institutions
      - formations
    section: Class Relations
    optional: true

  markets:
    type: entity_list
    target: markets
    section: Class Relations
    optional: true

  producers:
    type: entity_list
    target: producers
    section: Class Relations
    optional: true

  manufacturer_name:
    type: string
    optional: true

  dimension_length_m:
    type: number
    optional: true

  dimension_height_m:
    type: number
    optional: true

  dimension_width_m:
    type: number
    optional: true
