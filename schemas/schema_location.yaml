schema: locations

extends: entity_core

fields:

  location_class:
    type: string
    optional: true

  location_role:
    type: string
    optional: true

  building_class:
    type: string
    optional: true

  room_class:
    type: string
    optional: true

  floor_index:
    type: number
    optional: true

  floor_label:
    type: string
    optional: true

  room_number:
    type: string
    optional: true

  region_class:
    type: string
    optional: true

  parent_location:
    type: entity
    target: locations
    optional: true

  parent_cluster:
    type: entity
    target: locations
    optional: true

  controlling_factions:
    type: entity_list
    target: faction
    optional: true

  associated_cultures:
    type: entity_list
    target: culture
    optional: true

  population:
    type: dict
    optional: true

  coords:
    type: dict
    optional: true

  bounds:
    type: dict
    optional: true

  geometry:
    type: dict
    optional: true

  layer_kind:
    type: string
    optional: true

  parent_entity:
    type: entity
    target: locations
    optional: true

  owner_entity:
    type: entity
    target: entity
    optional: true

  coverage_mode:
    type: string
    optional: true

  resolution_m_per_pixel:
    type: number
    optional: true

  draw_order:
    type: number
    optional: true

  climate_tags:
    type: string_list
    optional: true

  derived_from_system_body:
    type: entity
    target: locations
    optional: true

  map_projection:
    type: string
    optional: true

  map_status:
    type: string
    optional: true

  map_canvas_width_px:
    type: number
    optional: true

  map_canvas_height_px:
    type: number
    optional: true

  map_image_path:
    type: string
    optional: true

  map_image_year:
    type: number
    optional: true

  map_image_fit:
    type: string
    optional: true

  environment_summary:
    type: dict
    optional: true

  geology_summary:
    type: dict
    optional: true

  hydrology_summary:
    type: dict
    optional: true

  ecology_summary:
    type: dict
    optional: true

