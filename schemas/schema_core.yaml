schema: entity_core

required:
  - id
  - pretty_name
  - type

fields:

  id:
    type: string

  pretty_name:
    type: string

  type:
    type: string

  name:
    type: string
    optional: true

  wiki_entry:
    type: text
    optional: true

  card_color:
    type: string
    section: Metadata
    optional: true

  card_header_color:
    type: string
    section: Metadata
    optional: true

  wiki_field_colors:
    type: dict
    section: Metadata
    optional: true

  tags:
    type: string_list
    optional: true

  start_year:
    type: number
    section: Temporal
    optional: true

  start_event:
    type: entity
    target: events
    section: Temporal
    optional: true

  end_year:
    type: number
    section: Temporal
    optional: true

  end_event:
    type: entity
    target: events
    section: Temporal
    optional: true

  derived_from:
    type: entity_list
    target: entity_core
    section: Relations
    optional: true

  parents:
    type: entity_list
    target: entity_core
    section: Relations
    optional: true

  related:
    type: entity_list
    target: entity_core
    section: Relations
    optional: true

  wiki_mentions:
    type: entity_list
    target: entity_core
    section: Relations
    optional: true

  offspring:
    type: object_list
    section: Relations
    optional: true

  entry_status:
    type: string
    optional: true

