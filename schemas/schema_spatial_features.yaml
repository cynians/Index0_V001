schema: spatial_features

extends: locations

fields:

  layer_kind:
    type: string

  owner_entity:
    type: entity
    optional: true

  parent_entity:
    type: entity
    optional: true

  geometry:
    type: dict

  resolution_m_per_pixel:
    type: number
    optional: true

  coverage_mode:
    type: string
    optional: true

  draw_order:
    type: number
    optional: true

