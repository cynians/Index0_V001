schema: institution

extends: entity_core

fields:

  institution_class:
    type: string
    optional: true

  institution_domain:
    type: string
    optional: true

  institution_scope:
    type: string
    optional: true

  parent_institution:
    type: entity
    target: institution
    optional: true

  controlling_faction:
    type: entity
    target: faction
    optional: true

  upheld_by:
    type: entity_list
    target: entity_core
    optional: true

  enforced_by:
    type: entity_list
    target: entity_core
    optional: true

  applies_to:
    type: entity_list
    target: entity_core
    optional: true

  associated_cultures:
    type: entity_list
    target: culture
    optional: true

  associated_locations:
    type: entity_list
    target: locations
    optional: true

  governed_locations:
    type: entity_list
    target: locations
    optional: true

  governed_bodies:
    type: entity_list
    target: locations
    optional: true

  legal_scope:
    type: string
    optional: true

  jurisdiction_model:
    type: string
    optional: true

  sovereignty_model:
    type: string
    optional: true

  territorial_rule:
    type: string
    optional: true

  territorial_radius_km:
    type: number
    optional: true

  institution_mechanisms:
    type: string_list
    optional: true

  signatories:
    type: entity_list
    target: entity_core
    optional: true

  ratifiers:
    type: entity_list
    target: entity_core
    optional: true

  treaty_domains:
    type: string_list
    optional: true

  predecessor_institutions:
    type: entity_list
    target: institution
    optional: true

  successor_institutions:
    type: entity_list
    target: institution
    optional: true

  effective_year:
    type: number
    optional: true

  end_condition:
    type: string
    optional: true


