schema: behaviors

extends: entity_core

fields:

  behavior_class:
    type: string
    optional: true

  activity_cycle:
    type: string_list
    optional: true

  social_structure:
    type: string_list
    optional: true

  movement_modes:
    type: string_list
    optional: true

  feeding_strategy:
    type: string_list
    optional: true

  habitat_use:
    type: string_list
    optional: true

  trigger_conditions:
    type: string_list
    optional: true

  response_patterns:
    type: string_list
    optional: true

  simulation_notes:
    type: text
    optional: true

