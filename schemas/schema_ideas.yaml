schema: idea

extends: entity_core

fields:

  idea_class:
    type: string
    optional: true

  related_entities:
    type: entity_list
    optional: true

  parent_entity:
    type: entity
    optional: true

  parent_ideas:
    type: entity_list
    target: ideas
    section: Relations
    optional: true

  source:
    type: text
    optional: true

  decision_status:
    type: string
    optional: true

