  description: Massive terrestrial megastructure city constructed by the Global Government
    Organization in the Central Asian steppes. During the GGO Hegemony it became the
    primary population and administrative center of Earth. The original complex consisted
    of five concentric urban rings surrounding the central core district, separated
    by inhabited infrastructure belts and enclosed by the CoG Outer Wall. Later phases
    expanded beyond the original structure into additional outer habitation and production
    districts.
