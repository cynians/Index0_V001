  - breach
  start_year: 5742
  entry_status: stub
  parents: []
  related: []
  offspring: []
  wiki_entry: 'In 5742, a late-CoG underclass gang exploited a cracked ventilation
    shaft to escape the quarantined megastructure. The route was first used for gang
    escape, then for selected family extractions, later for paid passage, before discovery
    triggered a major GGO police purge, disappearances into a sealed sector, and later
    covert regime reuse of the breach route.


    Historical importance was later largely erased from official memory and survived
    mostly through rumor, fragmentary reports, and local recollection.'
  end_year: 5941
  card_color: '#26201c'
