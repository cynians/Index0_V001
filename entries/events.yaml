  wiki_entry: 'In 2164, an inland expedition attached to a Panamericana coastal authority
    discovered a long-obsolete but still functioning F-22 in a deep storage hangar
    in the Rockies.


    Remembered mainly as a symbolic rediscovery of a lost military age, with a smaller
    but real reverse-engineering and reuse dimension.'
  card_color: '#454a5d'
- id: event_cog_quarantine_breach_and_crackdown_5742
