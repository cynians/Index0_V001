- id: idea_new_005
  pretty_name: Idea from Venus
  name: Terraformed Venus
  type: idea
  wiki_entry: |
    Venus is a much better candidate for terraforming when compared to Mars. 
    
    The thick atmosphere shields from radiation. The terraforming problem is more about changing and capturing atmosphere, rather than adding onto it.
    
    Another important point is Gravity. On [[planet_mars]], it is only 43%. On Venus it is 90%. 
  idea_class: note
  parent_entity: planet_venus
  related_entities:
  - planet_venus
  start_year: 6224
