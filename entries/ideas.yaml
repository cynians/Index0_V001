- id: idea_new_005
  pretty_name: Idea from Venus
  name: Terraformed Venus
  type: idea
  wiki_entry: "Venus is a much better candidate for terraforming when compared to\
    \ Mars. \n\nThe thick atmosphere shields from radiation. The terraforming problem\
    \ is more about changing and capturing atmosphere, rather than adding onto it.\n\
    \nAnother important point is Gravity. On [[planet_mars]], it is only 43%. On Venus\
    \ it is 90%. \n"
